name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: "Build tambahan setelah debug (APK/AAB release BELUM ditandatangani sampai Tahap 8)"
        type: choice
        default: none
        options:
          - none
          - assembleRelease
          - bundleRelease

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test dan build APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK sudah tersedia di runner ubuntu-latest ($ANDROID_HOME); cukup terima lisensinya.
      - name: Terima lisensi Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Gradle Wrapper dibuat bila belum ada di repository (lihat scripts/setup-wrapper.sh).
      - name: Siapkan Gradle Wrapper
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            sh scripts/setup-wrapper.sh
          fi
          chmod +x gradlew
          ./gradlew --version

      # Menguji skrip helper Termux dengan proses nyata (tanpa perlu Termux/Android).
      - name: Uji helper build Termux (dash dan bash)
        run: |
          SH_UNDER_TEST=dash sh scripts/test-build-helper.sh
          SH_UNDER_TEST=bash bash scripts/test-build-helper.sh

      - name: Unit test
        run: ./gradlew test --stacktrace

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CreateApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Build tambahan hanya jika dipilih saat "Run workflow"; push biasa tidak menjalankannya.
      - name: Build APK release (belum ditandatangani)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'assembleRelease' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK release (belum ditandatangani)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'assembleRelease' }}
        uses: actions/upload-artifact@v4
        with:
          name: CreateApp-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build AAB release (belum ditandatangani)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'bundleRelease' }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload AAB release (belum ditandatangani)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'bundleRelease' }}
        uses: actions/upload-artifact@v4
        with:
          name: CreateApp-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload laporan test (bila gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-test
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

# Release signing via GitHub Secrets adalah opsi terpisah dan dikerjakan pada Tahap 8.
# Jangan pernah memasukkan keystore atau password ke repository.
